name: Format fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        run: |
          git config user.name skyc10
          git config user.email skyc10@github.com
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "style: apply oxfmt to v3-final files"
            git push
          fi
