name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Disable minify for release
        working-directory: apps/mobile
        run: |
          grep -nE "minifyEnabled|enableMinifyInReleaseBuilds" android/app/build.gradle || true
          sed -i 's/minifyEnabled enableMinifyInReleaseBuilds/minifyEnabled false/' android/app/build.gradle
          sed -i 's/minifyEnabled enableProguardInReleaseBuilds/minifyEnabled false/' android/app/build.gradle
          sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle
          grep -nE "minifyEnabled" android/app/build.gradle
      - name: Debug autolinking stdout
        working-directory: apps/mobile
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/auto.json 2>/tmp/auto.err || true
          echo '--- stdout first 200 bytes ---'; head -c 200 /tmp/auto.json | cat -A
          echo '--- stderr ---'; head -50 /tmp/auto.err
      - name: Pin watched directories to empty JSON
        working-directory: apps/mobile
        run: printf '\nexpo.inlineModules.watchedDirectories=[]\n' >> android/gradle.properties
      - name: Warm Gradle distribution
        working-directory: apps/mobile
        run: cd android && ./gradlew --version
      - name: Build APK (release)
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -x lint --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
